<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TVJ Royale | Discord Embed Advert</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#32134d,#09090d 58%);color:#fff;font-family:Arial,sans-serif;padding:20px}.wrap{max-width:900px;margin:auto}.card{background:#15121c;border:1px solid #76551e;border-radius:20px;padding:22px;box-shadow:0 20px 70px #0009}h1{margin:0;color:#f1ca69;text-align:center}p{text-align:center;color:#c7bfce}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-weight:800;font-size:13px}input,select{width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid #584b62;background:#0e0c13;color:#fff}.full{grid-column:1/-1}button{width:100%;margin-top:15px;padding:13px;border:0;border-radius:10px;background:#d5aa48;color:#171109;font-weight:900;font-size:15px;cursor:pointer}.preview{margin-top:20px;background:#0d0c12;border-left:5px solid #d5aa48;border-radius:12px;padding:18px}.pvhead{color:#f1ca69;font-weight:900}.big{font-size:46px;font-weight:1000;margin:10px 0}.mega600{border-color:#a65cff}.mega600 .big{color:#c890ff}.mega1k{border-color:#e0b548}.mega1k .big{color:#f1ca69}.join{display:inline-block;margin-top:12px;padding:10px 16px;background:#d5aa48;color:#171109;border-radius:9px;font-weight:900}.note{font-size:12px;color:#a69cac;text-align:center;margin-top:12px}.status{text-align:center;margin-top:12px;font-weight:800}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.big{font-size:38px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>♛ TVJ ROYALE | DISCORD EMBED ADVERT ♛</h1>
<p>Create a professional Discord embed with a real clickable JOIN button.</p>
<div class="grid">
<div><label>EVENT</label><select id="event"><option value="200">200 💎 PARTY</option><option value="400" selected>400 💎 SPONTANEOUS PARTY</option><option value="600">600 💎 MEGA EVENT</option><option value="1000">1K 💎 MEGA EVENT</option></select></div>
<div><label>SPACES</label><input id="spaces" value="Limited spaces"></div>
<div class="full"><label>MESSAGE</label><input id="message" value="🎉 Come join the fun!"></div>
<div class="full"><label>DISCORD WEBHOOK URL</label><input id="webhook" type="password" placeholder="Paste the webhook URL for the advertising channel"></div>
</div>
<button onclick="send()">🚀 POST EMBED TO DISCORD</button>
<div class="preview" id="preview"></div>
<div class="status" id="status"></div>
<div class="note">⚠️ Keep webhook URLs private. Only use a webhook in a server/channel where the server owner or staff has given you permission to advertise.</div>
</div></div>
<script>
const invite='https://discord.gg/hfjUVu743';
const e=document.getElementById('event'),s=document.getElementById('spaces'),m=document.getElementById('message'),p=document.getElementById('preview'),st=document.getElementById('status');
function data(){
 const v=e.value, mega=v==='600'||v==='1000';
 let title,desc,color;
 if(v==='600'){title='👑🔥 600 💎 MEGA EVENT! 🔥👑';desc='💎 ONE OF OUR BIGGEST TVJ ROYALE PARTIES!';color=0xa65cff}
 else if(v==='1000'){title='🏆🔥 1K 💎 MEGA EVENT! 🔥🏆';desc='💎 THE ULTIMATE TVJ ROYALE PARTY!';color=0xe0b548}
 else if(v==='400'){title='🔥 400 💎 SPONTANEOUS PARTY! 🔥';desc='🎉 Spontaneous • Fun • Great vibes';color=0xd63384}
 else {title='🔥 200 💎 PARTY! 🔥';desc='🎉 Come join the fun!';color=0x4aa3ff}
 return {title,desc,color,mega};
}
function render(){
 const d=data(); p.className='preview '+(e.value==='600'?'mega600':e.value==='1000'?'mega1k':'');
 p.innerHTML='<div class="pvhead">♛ ᴛᴠᴊ ʀᴏʏᴀʟᴇ | ꜱᴜɴᴅᴀʏ ᴄɪᴛʏ ᴋɪɴɢᴅᴏᴍ ♛</div><div class="big">'+d.title+'</div><div>'+d.desc+'</div><div style="margin-top:10px">👥 '+s.value+'<br>'+m.value+'</div><a class="join" href="'+invite+'" target="_blank">👑 JOIN TVJ ROYALE 👑</a></div>';
}
async function send(){
 const url=document.getElementById('webhook').value.trim();
 if(!url){st.textContent='Paste a Discord webhook URL first.';return}
 const d=data();
 const payload={username:'TVJ Royale',embeds:[{title:'♛ ᴛᴠᴊ ʀᴏʏᴀʟᴇ | ꜱᴜɴᴅᴀʏ ᴄɪᴛʏ ᴋɪɴɢᴅᴏᴍ ♛',description:'**'+d.title+'**\\n\\n'+d.desc+'\\n\\n👥 **'+s.value+'**\\n'+m.value, color:d.color,footer:{text:'TVJ ROYALE — WHERE THE PARTY NEVER STOPS!'}}],components:[{type:1,components:[{type:2,style:5,label:'👑 JOIN TVJ ROYALE',url:invite}]}]};
 try{
  st.textContent='Posting…';
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  st.textContent='✅ Advert posted successfully!';
 }catch(err){st.textContent='❌ Could not post. Check the webhook URL, CORS restrictions, and webhook permissions.';}
}
[e,s,m].forEach(x=>x.addEventListener('input',render));e.addEventListener('change',render);render();
</script>
</body></html>
